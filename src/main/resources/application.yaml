spring:
  application:
    name: reward-scoring-service

server:
  port: 8080
  # Reject oversized bodies at the container edge, before deserialisation.
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
